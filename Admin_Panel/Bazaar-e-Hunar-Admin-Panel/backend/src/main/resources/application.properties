spring.application.name=bazaar-e-hunar-backend
server.port=${SERVER_PORT:8081}

# Read backend/.env (MONGODB_URI, CLOUDINARY_*, ...) automatically. Real environment variables still win.
# (the second path lets you start the backend from the project root or from an IDE as well)
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

# MongoDB is the main database: users, products, artisans, reviews, orders,
# custom orders and contact messages are all stored in it.
# MONGODB_URI comes from backend/.env (Atlas "mongodb+srv://..." or local "mongodb://localhost:27017").
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:bazaar_e_hunar}
spring.data.mongodb.auto-index-creation=true

# Old local JSON files. They are only read ONCE to copy existing users/reviews into MongoDB
# (when the MongoDB collection is still empty). They are no longer written to.
app.data.users-file=${USERS_FILE:data/users.json}
app.data.reviews-file=${REVIEWS_FILE:data/reviews.json}

# Cloudinary stores real product image files. Product records store the returned secure URL.
# Keep the three values private and set them through environment variables, never in Git.
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
# Frontend assets folder (the one that contains products/<category>/1.jpg ...). Leave blank to auto-detect
# ../frontend/public/assets, ../frontend/src/assets, ./assets. Images are uploaded to Cloudinary folder
# bazaar-e-hunar/products/<category>/ in the background on startup (already uploaded files are skipped).
app.cloudinary.assets-dir=${CLOUDINARY_ASSETS_DIR:}
app.cloudinary.sync-on-startup=${CLOUDINARY_SYNC_ON_STARTUP:true}

# JWT. Development default is intentionally long enough for HMAC signing.
app.jwt.secret=${JWT_SECRET:bazaar-e-hunar-local-development-secret-key-12345678901234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Frontend origin for CORS.
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
# Separate admin panel project (admin-panel/, port 5174). Comma-separate to allow more origins.
app.admin.origin=${ADMIN_ORIGIN:http://localhost:5174}

# Optional first admin account. Leave blank to skip admin seeding.
app.admin.email=${ADMIN_EMAIL:admin@bazaarehunar.com}
app.admin.password=${ADMIN_PASSWORD:Admin123!}
app.admin.name=${ADMIN_NAME:System Admin}

spring.jackson.default-property-inclusion=non_null

# Product image uploads from the admin panel (the form allows up to 5 MB; Spring's default is only 1 MB).
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB

# When true, the admin account's password is reset to ADMIN_PASSWORD on every start (use it once if you
# cannot log in, then set it back to false).
app.admin.reset-password=${ADMIN_RESET_PASSWORD:false}
