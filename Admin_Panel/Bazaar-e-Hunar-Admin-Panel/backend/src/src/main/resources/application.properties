spring.application.name=bazaar-e-hunar-backend
server.port=${SERVER_PORT:8081}

# Error-free local university demo storage.
# Registered users are persisted automatically in backend/data/users.json.
# No MongoDB installation, Atlas account, IP allow-list, or TLS setup is required.
app.data.users-file=${USERS_FILE:data/users.json}
# Product reviews are stored locally the same way, in backend/data/reviews.json.
app.data.reviews-file=${REVIEWS_FILE:data/reviews.json}

# Cloudinary stores real product image files. Product records store the returned secure URL.
# Keep the three values private and set them through environment variables, never in Git.
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# JWT. Development default is intentionally long enough for HMAC signing.
app.jwt.secret=${JWT_SECRET:bazaar-e-hunar-local-development-secret-key-12345678901234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Frontend origin for CORS.
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Optional first admin account. Leave blank to skip admin seeding.
app.admin.email=${ADMIN_EMAIL:admin@bazaarehunar.com}
app.admin.password=${ADMIN_PASSWORD:Admin123!}
app.admin.name=${ADMIN_NAME:System Admin}

spring.jackson.default-property-inclusion=non_null
